name: Foundation

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format check
        working-directory: foundation
        run: zig fmt --check build.zig src adapters tests examples tools benchmarks
      - name: Governance checks
        working-directory: foundation
        run: zig build check
      - name: Default build and tests
        working-directory: foundation
        run: zig build test
      - name: Core build and tests
        working-directory: foundation
        run: zig build -Dprofile=core test
      - name: Core consumer example
        working-directory: foundation
        run: zig build -Dprofile=core examples-test
      - name: Benchmark smoke check
        working-directory: foundation
        run: zig build -Dprofile=core benchmark-smoke
      - name: C header syntax
        working-directory: foundation
        shell: bash
        run: printf '#include "foundation.h"\nint main(void) { return 0; }\n' | zig cc -x c -c -I "$PWD/include" -o /dev/null -
  profiles:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [game, agent, tooling, server]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Profile tests
        working-directory: foundation
        run: zig build -Dprofile=${{ matrix.profile }} test
      - name: Consumer fixture
        working-directory: foundation
        run: zig build -Dprofile=${{ matrix.profile }} examples-test
      - name: ABI consumers
        working-directory: foundation
        run: zig build -Dprofile=${{ matrix.profile }} cabi-test
      - name: Benchmark smoke check
        working-directory: foundation
        run: zig build -Dprofile=${{ matrix.profile }} benchmark-smoke
  portable-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Portable game profile
        working-directory: foundation
        run: zig build -Dprofile=game test
      - name: Portable agent profile without Windows curl bundle
        working-directory: foundation
        run: zig build -Dprofile=agent -Dhttp=false test
      - name: Portable tooling profile without Windows-only adapters
        working-directory: foundation
        run: zig build -Dprofile=tooling -Dhttp=false -Dlibuv=false test
      - name: Portable server profile without Windows-only adapters
        working-directory: foundation
        run: zig build -Dprofile=server -Dhttp=false -Dlibuv=false test
